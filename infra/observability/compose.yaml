# Observability backend for Incident Copilot and the OpenTelemetry Demo it operates (ADR 008).
# Runs on the developer's Mac (OrbStack), about 1.5GB of memory in total.
#
#   docker compose -f infra/observability/compose.yaml up -d   # start this first: it creates the network
#   infra/scripts/otel-demo.sh up                              # the demo's collector then forwards here
#
# Data flow: app / MCP servers --OTLP--> otel-gateway (localhost:4318)
#            OTel Demo services -> demo otel-collector --OTLP--> otel-gateway
#            otel-gateway -> Tempo (traces), Loki (logs), Prometheus (metrics, span metrics, service graph)
name: incident-observability

networks:
  default:
    # Fixed name: infra/observability/otel-demo/compose.extras.yaml attaches the demo collector to it.
    name: incident-observability

services:
  otel-gateway:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317" # OTLP gRPC
      - "127.0.0.1:4318:4318" # OTLP HTTP (OTEL_EXPORTER_OTLP_ENDPOINT in .env.example)
    deploy:
      resources:
        limits:
          memory: 400M
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: unless-stopped

  tempo:
    image: grafana/tempo:3.1.1
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200" # query API (mcp-observability reads traces here)
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  loki:
    image: grafana/loki:3.7.9
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100" # query API (mcp-observability reads logs here)
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  prometheus:
    image: quay.io/prometheus/prometheus:v3.13.1
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-otlp-receiver
      - --web.enable-lifecycle
      - --enable-feature=exemplar-storage
    volumes:
      - ./prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.1.3
    environment:
      # Local only: anonymous Admin, no login form. Never expose this port beyond localhost.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      # Where Grafana alerts are delivered: the api's Alertmanager webhook, so Incident Copilot
      # can investigate its own alerts. Override if the api runs elsewhere.
      INCIDENT_API_WEBHOOK_URL: ${INCIDENT_API_WEBHOOK_URL:-http://host.docker.internal:3000/alerts/webhook}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000" # 3000 is the api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prometheus
      - tempo
      - loki
    restart: unless-stopped

volumes:
  tempo-data:
  loki-data:
  prometheus-data:
  grafana-data:
